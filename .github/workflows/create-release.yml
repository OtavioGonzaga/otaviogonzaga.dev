name: Create Release

on:
  workflow_dispatch:
    inputs:
      version: { description: SemVer without v prefix, required: true, type: string }

concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'release must start from main' >&2; exit 1; }
          git fetch origin main --tags
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo 'main advanced' >&2; exit 1; }
          ! git show-ref --verify --quiet "refs/tags/v$VERSION" || { echo 'tag exists' >&2; exit 1; }
          bun scripts/release.ts "$VERSION"
          changed=$(git diff --name-only)
          [ "$changed" = $'CHANGELOG.md\npackage.json' ] || { echo 'unexpected release changes' >&2; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package.json && git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
  image:
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      image_tag: ${{ needs.prepare.outputs.tag }}
  github-release:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - run: bun scripts/extract-release-notes.ts "${{ inputs.version }}" > "$RUNNER_TEMP/notes.md"
      - run: gh release create "${{ needs.prepare.outputs.tag }}" --verify-tag --title "${{ needs.prepare.outputs.tag }}" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
