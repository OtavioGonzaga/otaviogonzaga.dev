name: Create Release

on:
  workflow_dispatch:
    inputs:
      version: { description: SemVer without v prefix, required: true, type: string }

concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  preflight:
    needs: ci
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      prepared: ${{ steps.state.outputs.prepared }}
      release_commit_sha: ${{ steps.state.outputs.release_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'release must start from main' >&2; exit 1; }
          git fetch origin main --tags
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo 'main advanced' >&2; exit 1; }
          bash scripts/release-state.sh "$VERSION" >> "$GITHUB_OUTPUT"
  prepare:
    needs: preflight
    if: needs.preflight.outputs.prepared == 'false'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      release_commit_sha: ${{ steps.release.outputs.release_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup-bun
      - id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || { echo 'main advanced' >&2; exit 1; }
          bun scripts/release.ts "$VERSION"
          changed=$(git diff --name-only)
          [ "$changed" = $'CHANGELOG.md\npackage.json' ] || { echo 'unexpected release changes' >&2; exit 1; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package.json && git commit -m "chore(release): v$VERSION"
          git push origin HEAD:main
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  image:
    needs: [preflight, prepare]
    if: always() && !failure() && !cancelled()
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
      image_tag: v${{ inputs.version }}
  github-release:
    needs: [preflight, prepare, image]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Create or verify annotated release tag
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit_sha || needs.preflight.outputs.release_commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [ "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" ]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            [ "$(git cat-file -t "refs/tags/v$VERSION")" = tag ]
            [ "$(git rev-parse "v$VERSION^{}")" = "$RELEASE_COMMIT" ]
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "v$VERSION" "$RELEASE_COMMIT" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi
      - run: bun scripts/extract-release-notes.ts "${{ inputs.version }}" > "$RUNNER_TEMP/notes.md"
      - run: |
          if ! gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            gh release create "v${{ inputs.version }}" --verify-tag --title "v${{ inputs.version }}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
