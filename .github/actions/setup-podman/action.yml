name: Setup Podman
description: Ensure Podman is available on the runner.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if ! command -v podman >/dev/null; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman
        fi
        podman version
