name: Setup Bun
description: Install the pinned Bun version and project dependencies.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
    - shell: bash
      run: bun install --frozen-lockfile
