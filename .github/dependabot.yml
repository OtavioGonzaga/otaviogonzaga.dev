version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly, day: monday, time: "04:00", timezone: America/Sao_Paulo }
    groups:
      dependencies: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: tuesday, time: "04:00", timezone: America/Sao_Paulo }
    groups:
      actions: { patterns: ["*"] }
